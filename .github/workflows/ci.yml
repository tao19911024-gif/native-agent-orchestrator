name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-package:
    name: Windows / Python 3.13
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PDCL_MODEL_CATALOGUE: snapshot
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build --outdir dist

      - name: Install wheel in an independent environment
        run: |
          $RuntimeEnvironment = Join-Path $env:RUNNER_TEMP 'nao-runtime'
          python -m venv $RuntimeEnvironment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $RuntimePython = Join-Path $RuntimeEnvironment 'Scripts/python.exe'
          $WheelPath = (Get-ChildItem dist -Filter *.whl).FullName
          & $RuntimePython -m pip install "${WheelPath}[test]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path ci-results -Force | Out-Null

      - name: Check installed command entry points
        run: |
          $RuntimePython = Join-Path $env:RUNNER_TEMP 'nao-runtime/Scripts/python.exe'
          & $RuntimePython -I -m foundry_runtime --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $RuntimePython -I -m foundry_runtime.recovery --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run offline installed-package tests
        run: |
          $RuntimePython = Join-Path $env:RUNNER_TEMP 'nao-runtime/Scripts/python.exe'
          & $RuntimePython -m pytest tests/test_installed_runtime.py tests/test_project_launch.py `
            tests/test_release_retention.py tests/test_release_selection.py `
            tests/test_delivery_baseline.py tests/test_unfinished_task_usage.py `
            tests/test_feedback_loop.py tests/test_hosted.py `
            tests/test_review_context.py `
            tests/test_codex_reconnect.py `
            tests/test_review_participants.py tests/test_relocated_retention.py `
            tests/test_launch_context.py `
            tests/test_failed_manager_handback.py tests/test_completed_turn_recovery.py `
            tests/test_goal_preflight_recovery.py tests/test_execution_stop.py `
            tests/test_project_default_provider.py tests/test_goal_scratch.py `
            tests/test_goal_checkpoint_publication.py tests/test_review_authorship_recovery.py `
            tests/test_project_hooks_deadline.py tests/test_root_exit_cleanup.py `
            tests/test_worker_scratch_environment.py `
            tests/test_managed_coding_handoff.py tests/test_artifact_directories.py `
            tests/test_capacity_recovery.py tests/test_acceptance_feedback.py tests/test_assignment_refusal.py `
            tests/test_acceptance_a96.py tests/test_acceptance_a69.py tests/test_acceptance_a67.py `
            --junitxml ci-results/pytest.xml -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Initialize example projects
        run: |
          $RuntimePython = Join-Path $env:RUNNER_TEMP 'nao-runtime/Scripts/python.exe'
          foreach ($Scenario in @('execution', 'continuation', 'review')) {
            $ExampleRoot = Join-Path $env:RUNNER_TEMP "nao-example-$Scenario"
            & $RuntimePython examples/quickstart.py $ExampleRoot --scenario $Scenario
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $ReportDirectory = Join-Path 'ci-results/examples' $Scenario
            New-Item -ItemType Directory -Path $ReportDirectory -Force | Out-Null
            Copy-Item -Path "$ExampleRoot/*.json", "$ExampleRoot/baseline-tests.txt" `
              -Destination $ReportDirectory
          }

      - name: Upload distributions and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-python313
          path: |
            dist/
            ci-results/
